<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Seite nicht gefunden | Rodrigo Normando Art</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      :root {
        --color-background: #f2ebdd;
        --color-text: #29251f;
        --color-action: #71382d;
        --color-action-hover: #a6533f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --color-background: #29251f;
          --color-text: #f2ebdd;
          --color-action: #c58b32;
          --color-action-hover: #f2ebdd;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--color-background);
        color: var(--color-text);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      h1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(3rem, 8vw, 6rem);
        margin: 0 0 1rem;
        color: var(--color-action);
      }
      p {
        font-size: 1.125rem;
        max-width: 48ch;
        line-height: 1.6;
        margin: 0 0 2rem;
      }
      .actions {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background: var(--color-action);
        color: #fff;
        text-decoration: none;
        border-radius: 4px;
        font-weight: 600;
        transition: background 0.2s ease;
      }
      a:hover {
        background: var(--color-action-hover);
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>
      Die gesuchte Seite konnte leider nicht gefunden werden.
      <br />
      <em>The requested page could not be found.</em>
      <br />
      <em>A página solicitada não foi encontrada.</em>
    </p>
    <div class="actions">
      <a href="/de/">Startseite (DE)</a>
      <a href="/en/">Home (EN)</a>
      <a href="/pt/">Início (PT)</a>
    </div>
  </body>
</html>
