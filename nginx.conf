server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable directory listing
    autoindex off;

    # Security Headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://formspree.io; frame-ancestors 'none'; base-uri 'self'; object-src 'none';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Healthcheck endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    # Root redirect to default language (/de/)
    location = / {
        return 301 /de/;
    }

    # Normalized trailing slash redirects
    location = /de { return 301 /de/; }
    location = /pt { return 301 /pt/; }
    location = /en { return 301 /en/; }
    location = /impressum { return 301 /impressum/; }
    location = /datenschutz { return 301 /datenschutz/; }

    # Localized and legal static routes
    location /de/ {
        try_files $uri $uri/ /de/index.html =404;
        add_header Cache-Control "public, no-cache" always;
    }

    location /pt/ {
        try_files $uri $uri/ /pt/index.html =404;
        add_header Cache-Control "public, no-cache" always;
    }

    location /en/ {
        try_files $uri $uri/ /en/index.html =404;
        add_header Cache-Control "public, no-cache" always;
    }

    location /impressum/ {
        try_files $uri $uri/ /impressum/index.html =404;
        add_header Cache-Control "public, no-cache" always;
    }

    location /datenschutz/ {
        try_files $uri $uri/ /datenschutz/index.html =404;
        add_header Cache-Control "public, no-cache" always;
    }

    # Immutable cached assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Static root files (revalidate)
    location ~* ^/(robots\.txt|sitemap\.xml|manifest\.json|favicon\.ico|theme-init\.js|og-image\.(jpg|png)|Gagarin-Focus\.JPEG)$ {
        expires 1d;
        add_header Cache-Control "public, no-cache" always;
        try_files $uri =404;
    }

    # Deny access to hidden files and dotfiles (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to source maps and backup files
    location ~* \.(map|bak|old|orig|save)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Real 404 handler for unknown URLs
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # Default fallback returns 404, never 200 index.html for unknown routes
    location / {
        try_files $uri $uri/ =404;
    }
}
